# Costruisce le immagini Docker e le pubblica su GitHub Container Registry (ghcr.io).
# Con un repository privato anche le immagini restano private (visibili solo a chi ha accesso al repository).
#
# Immagini prodotte (ghcr.io/<utente>/<repository> in minuscolo):
#   <immagine>:latest           app (target "runtime" del Dockerfile)
#   <immagine>-migrate:latest   migrazioni del database (target "migrate")
# Oltre a "latest" ogni immagine ha il tag con la versione di version.json (es. "0.1.1"), "sha-<commit>"
# e, per i tag git v1.2.3, anche "1.2.3" e "1.2".
#
# Sulla VPS (una volta sola):  echo <token con permesso read:packages> | docker login ghcr.io -u <utente> --password-stdin
name: Immagine Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Un solo build per volta sullo stesso ramo: quello vecchio si annulla se ne arriva uno nuovo.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Architettura della VPS: linux/amd64 (Intel/AMD) oppure linux/arm64 (es. Ampere).
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versione dell'applicazione: unica fonte version.json (cartella principale).
      - id: version
        run: echo "version=$(jq -r .version version.json)" >> "$GITHUB_OUTPUT"

      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-migrate
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # La fase "build" del Dockerfile è comune ai due target: la seconda immagine riusa la cache della prima.
      - name: App
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrazioni
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
