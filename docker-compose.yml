# Avvio sulla VPS:  docker compose up -d --build
# Prima crea un file .env accanto a questo con:  POSTGRES_PASSWORD=<una password lunga e casuale>
# L'app ascolta solo su 127.0.0.1:3000: va esposta tramite un reverse proxy con HTTPS (Caddy, nginx, Traefik).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: cartelle
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alby -d cartelle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applica le migrazioni e termina; l'app parte solo se sono andate a buon fine.
  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alby:${POSTGRES_PASSWORD}@db:5432/cartelle

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://alby:${POSTGRES_PASSWORD}@db:5432/cartelle
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      # Immagini DICOM: file sul disco (nel database solo i dati descrittivi).
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  # Da includere nei backup insieme al database.
  storage:
