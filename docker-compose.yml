# Avvio sulla VPS (nella cartella che contiene questo file):
#   docker compose pull && docker compose up -d
# Le immagini sono quelle pubblicate su GitHub (ghcr.io), costruite dal workflow .github/workflows/docker.yml:
# sulla VPS non si compila nulla e non serve il codice sorgente, basta questo file con il suo .env.
# Prima crea un file .env accanto a questo con:  POSTGRES_PASSWORD=<una password lunga e casuale>
# Versione da usare (app e migrazioni sempre uguali):  CARTELLE_VERSION=0.1.0  (predefinita), oppure "latest".
#
# Struttura sulla VPS:
#   /srv/cartelle_cliniche/data   dati: database e archivio dei file (da salvare nei backup)
#
# L'app non pubblica porte sull'host: il reverse proxy nginx la raggiunge attraverso la rete "proxy-net"
# con destinazione  cartelle_cliniche:3000  (HTTPS gestito dal proxy).
# Il database resta sulla sola rete interna del progetto: gli altri container della rete proxy-net non lo vedono.

# Nome fisso del progetto: senza, Docker userebbe il nome della cartella ("code"), uguale per tutti i
# progetti con la stessa struttura, e i loro servizi si mescolerebbero.
name: cartelle_cliniche

services:
  db:
    # Stessa immagine già usata dagli altri container della VPS.
    image: postgres:17-alpine
    container_name: cartelle_cliniche_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: cartelle
    volumes:
      # PostgreSQL 17 tiene i dati in /var/lib/postgresql/data. Una cartella dati creata con una versione
      # principale non si apre con un'altra: per cambiare versione serve dump e ripristino (o pg_upgrade).
      - /srv/cartelle_cliniche/data/postgresql:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alby -d cartelle"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applica le migrazioni e termina; l'app parte solo se sono andate a buon fine.
  migrate:
    image: ghcr.io/albyalex96/cartelle-cliniche-migrate:${CARTELLE_VERSION:-0.1.0}
    container_name: cartelle_cliniche_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alby:${POSTGRES_PASSWORD}@db:5432/cartelle
    networks:
      - internal

  app:
    image: ghcr.io/albyalex96/cartelle-cliniche:${CARTELLE_VERSION:-0.1.0}
    container_name: cartelle_cliniche
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://alby:${POSTGRES_PASSWORD}@db:5432/cartelle
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      # Immagini DICOM: file sul disco (nel database solo i dati descrittivi).
      STORAGE_DIR: /data/storage
      # OCR delle scansioni (Tesseract nell'immagine, nessun servizio esterno). "false" = come prima.
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
    volumes:
      # La cartella sull'host deve appartenere all'utente 1000 (quello che esegue l'app nel container).
      - /srv/cartelle_cliniche/data/storage:/data/storage
    # File temporanei solo in memoria: nulla di quello che l'app elabora finisce su disco per sbaglio.
    tmpfs:
      - /tmp:size=256m
    # Limiti per non togliere risorse agli altri servizi della VPS (l'OCR usa 1 core alla volta).
    # Adattali alla macchina (APP_CPUS / APP_MEMORY nel file .env). Margine per i caricamenti dei CD DICOM.
    cpus: ${APP_CPUS:-1.5}
    mem_limit: ${APP_MEMORY:-2g}
    networks:
      - proxy-net
      - internal

networks:
  # Rete già esistente sulla VPS, condivisa con nginx.
  proxy-net:
    external: true
  # Rete privata del progetto (app, migrazioni, database).
  internal:
